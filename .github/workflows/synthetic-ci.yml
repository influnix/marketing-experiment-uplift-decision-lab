name: Synthetic dashboard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "dashboard/**"
      - ".streamlit/config.toml"
      - "requirements-dashboard.txt"
      - "scripts/verify_*dashboard.py"
      - ".github/workflows/synthetic-ci.yml"

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.5"
      - name: Install and record dashboard dependencies
        run: |
          python -m pip install -r requirements-dashboard.txt
          python -m pip check
          python -m pip freeze
      - name: Run the allowlisted suite from a data-free tree
        run: python -I -B scripts/verify_data_free_dashboard.py --output "${RUNNER_TEMP}/day14-dashboard"
